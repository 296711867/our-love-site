    <circle cx="386" cy="828" r="7" opacity=".75"/>
    <circle cx="402" cy="852" r="8" opacity=".6"/>
    <circle cx="380" cy="878" r="7" opacity=".5"/>
    <circle cx="410" cy="900" r="6" opacity=".4"/>
