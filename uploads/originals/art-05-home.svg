      <path d="M 0 -66 L 0 -86"/><path d="M 66 0 L 86 0"/><path d="M 0 66 L 0 86"/><path d="M -66 0 L -86 0"/>
      <path d="M 47 -47 L 61 -61"/><path d="M 47 47 L 61 61"/><path d="M -47 47 L -61 61"/><path d="M -47 -47 L -61 -61"/>
    </g>
  </g>

  <!-- 房子 -->
