  <path d="M 200 88 C 130 88 84 140 84 210 C 84 288 134 334 200 334 C 266 334 316 288 316 210 C 316 140 270 88 200 88 Z"
        fill="#f7e5e2" stroke="#c97f84" stroke-width="9"/>

