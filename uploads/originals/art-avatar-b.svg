  <path d="M 148 116 C 128 82 124 52 136 42" fill="none" stroke="#e5989b" stroke-width="10" stroke-linecap="round"/>
  <path d="M 252 116 C 272 82 276 52 264 42" fill="none" stroke="#e5989b" stroke-width="10" stroke-linecap="round"/>

