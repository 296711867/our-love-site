    <circle cx="16" cy="-4" r="11" fill="#fff7ec" stroke="#c8a27a" stroke-width="5"/>
    <circle cx="10" cy="13" r="11" fill="#fff7ec" stroke="#c8a27a" stroke-width="5"/>
    <circle cx="-10" cy="13" r="11" fill="#fff7ec" stroke="#c8a27a" stroke-width="5"/>
    <circle cx="-16" cy="-4" r="11" fill="#fff7ec" stroke="#c8a27a" stroke-width="5"/>
    <circle r="8" fill="#f6dcae" stroke="#c8a27a" stroke-width="4"/>
  </g>

  <!-- 眼睛（圆眼 + 睫毛） -->
  <circle cx="144" cy="196" r="12" fill="#6b5d4a"/>
  <circle cx="148" cy="192" r="4" fill="#fff"/>
  <circle cx="256" cy="196" r="12" fill="#6b5d4a"/>
  <circle cx="260" cy="192" r="4" fill="#fff"/>
  <g fill="none" stroke="#6b5d4a" stroke-width="5" stroke-linecap="round">
    <path d="M 130 180 L 122 174"/><path d="M 138 172 L 132 164"/>
    <path d="M 270 180 L 278 174"/><path d="M 262 172 L 268 164"/>
  </g>

