      <path d="M 96 116 L 132 116 L 96 144 L 132 144"/>
      <path d="M 152 68 L 178 68 L 152 90 L 178 90"/>
    </g>
  </g>

  <!-- 云朵 -->
  <g transform="translate(392 830)">
    <path d="M -150 36 Q -158 -6 -112 -12 Q -104 -52 -58 -42 Q -40 -76 0 -60 Q 44 -76 58 -40 Q 108 -48 112 -8 Q 150 0 142 32 Q 138 46 122 44 L -128 44 Q -146 44 -150 36 Z"
